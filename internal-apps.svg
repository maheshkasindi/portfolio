<svg width="500" height="250" viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="250" fill="url(#bgGradient)"/>

  <!-- Dashboard Icon -->
  <g transform="translate(80, 60)">
    <!-- Frame -->
    <rect x="0" y="0" width="100" height="80" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Top bar -->
    <rect x="8" y="8" width="84" height="12" rx="4" fill="rgba(255,255,255,0.25)"/>
    <!-- Charts -->
    <rect x="8" y="28" width="36" height="44" rx="4" fill="rgba(255,255,255,0.25)"/>
    <rect x="52" y="28" width="40" height="44" rx="4" fill="rgba(255,255,255,0.25)"/>
  </g>

  <!-- Users/Team Icon -->
  <g transform="translate(320, 60)">
    <!-- Circle background -->
    <circle cx="50" cy="40" r="45" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- User icons -->
    <circle cx="35" cy="32" r="10" fill="rgba(255,255,255,0.3)"/>
    <path d="M 20 55 Q 35 45 50 55" fill="rgba(255,255,255,0.3)"/>

    <circle cx="65" cy="32" r="10" fill="rgba(255,255,255,0.3)"/>
    <path d="M 50 55 Q 65 45 80 55" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- Gear/Settings Icon -->
  <g transform="translate(100, 160)">
    <circle cx="30" cy="30" r="28" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Gear shape -->
    <circle cx="30" cy="30" r="12" fill="rgba(255,255,255,0.3)"/>
    <circle cx="30" cy="30" r="6" fill="url(#bgGradient)"/>
    <!-- Gear teeth -->
    <rect x="28" y="8" width="4" height="8" fill="rgba(255,255,255,0.3)"/>
    <rect x="28" y="44" width="4" height="8" fill="rgba(255,255,255,0.3)"/>
    <rect x="8" y="28" width="8" height="4" fill="rgba(255,255,255,0.3)"/>
    <rect x="44" y="28" width="8" height="4" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- Chart/Analytics Icon -->
  <g transform="translate(220, 165)">
    <rect x="0" y="0" width="60" height="50" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Bars -->
    <rect x="8" y="30" width="10" height="12" rx="2" fill="rgba(255,255,255,0.35)"/>
    <rect x="22" y="20" width="10" height="22" rx="2" fill="rgba(255,255,255,0.35)"/>
    <rect x="36" y="15" width="10" height="27" rx="2" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- Box/Inventory Icon -->
  <g transform="translate(335, 160)">
    <path d="M 30 10 L 50 20 L 50 45 L 30 55 L 10 45 L 10 20 Z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <path d="M 30 10 L 30 33" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <path d="M 10 20 L 30 33 L 50 20" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none"/>
  </g>

  <!-- Connecting Lines -->
  <line x1="130" y1="100" x2="220" y2="120" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="180" y1="100" x2="320" y2="100" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="370" y1="105" x2="360" y2="160" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="130" y1="140" x2="220" y2="165" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,5"/>
</svg>
