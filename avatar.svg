<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eab308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ca8a04;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarGradient)"/>

  <!-- Decorative Circles -->
  <circle cx="150" cy="50" r="15" fill="rgba(255,255,255,0.1)"/>
  <circle cx="170" cy="120" r="10" fill="rgba(255,255,255,0.08)"/>
  <circle cx="40" cy="60" r="12" fill="rgba(255,255,255,0.06)"/>
  <circle cx="30" cy="140" r="18" fill="rgba(255,255,255,0.1)"/>

  <!-- Letter M -->
  <text
    x="100"
    y="100"
    font-family="Arial, sans-serif"
    font-size="90"
    font-weight="700"
    fill="url(#letterGradient)"
    text-anchor="middle"
    dominant-baseline="central">
    M
  </text>
</svg>
